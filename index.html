<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackhouse Media</title>
<meta name="description" content="The latest anime updates.">
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#262626;--tx:#f5f5f5;--mut:#9a9a9a;--red:#e8194b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:0 18px 56px}
header{text-align:center;padding:40px 0 18px}
header svg{width:150px;max-width:50%;height:auto}
.n{font-weight:800;letter-spacing:.28em;font-size:26px;margin:6px 0 0}
.bar{width:90px;height:2px;background:var(--red);margin:10px auto}
.m{letter-spacing:.5em;color:var(--mut);font-size:13px}
.tag{color:var(--mut);margin:18px 0 0}
h2{font-size:14px;letter-spacing:.2em;color:var(--mut);margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{margin:6px 0 8px;font-size:20px;line-height:1.3}
.pill{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.d{color:var(--mut);font-size:13px;margin-left:8px}
.card p{margin:0 0 10px;white-space:pre-wrap}
.card img{width:100%;border-radius:10px;margin:4px 0 12px;display:block}
.src{font-size:14px;color:var(--mut)}
.src a{color:var(--red);word-break:break-all}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:32px}
</style>
</head>
<body>
<div class="w">
<header>
<svg viewBox="290 235 420 400" aria-label="Blackhouse Media logo"><polygon points="320,410 500,260 680,410 680,610 320,610" fill="none" stroke="#fff" stroke-width="16" stroke-linejoin="round"/><polygon points="472,455 566,510 472,565" fill="#e8194b"/></svg>
<div class="n">BLACKHOUSE</div><div class="bar"></div><div class="m">MEDIA</div>
<p class="tag">The latest anime updates.</p>
</header>
<h2>LATEST UPDATES</h2>
<div id="feed"></div>
<footer>&copy; Blackhouse Media</footer>
</div>
<script>
/* ====== YOUR POSTS: add a new post at the TOP of this list ======
   Fields: date, series, title, body, img (optional picture link or file name), sources (optional)  */
const POSTS = [
  {
    date: "Oct 12, 2026",
    series: "Welcome",
    title: "Welcome to Blackhouse Media",
    body: "This is where I post the latest anime updates. Check back often for new posts!",
    img: "",
    sources: []
  }
];
/* ====== END OF POSTS ====== */

const feed = document.getElementById('feed');
function el(t, c, x){ const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
if (!POSTS.length) feed.append(el('p', 'src', 'No posts yet. Check back soon!'));
POSTS.forEach(p => {
  const c = el('div', 'card');
  const top = el('div');
  top.append(el('span', 'pill', p.series || 'Update'), el('span', 'd', p.date || ''));
  c.append(top, el('h3', null, p.title));
  if (p.img) { const im = el('img'); im.src = p.img; im.alt = p.title; im.loading = 'lazy'; c.append(im); }
  c.append(el('p', null, p.body));
  if (p.sources && p.sources.length) {
    const s = el('div', 'src'); s.append('Sources: ');
    p.sources.forEach((x, i) => {
      if (!/^https?:\/\//.test(x.url)) return;
      if (i) s.append(' \u00b7 ');
      const a = el('a', null, x.name); a.href = x.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; s.append(a);
    });
    c.append(s);
  }
  feed.append(c);
});
</script>
</body>
</html>
