<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0a0a0a;--panel:#0d0d0d;--line:#262626;--text:#f2f2f2;--mute:#8a8a8a;--accent:#e5194f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{padding:16px 20px 24px;text-align:center;border-bottom:1px solid var(--line)}
h1{margin:0}
h1 img{width:min(260px,70vw);height:auto;display:block;margin:0 auto}
header p{color:var(--mute);margin:14px 0 0}
main{max-width:640px;margin:0 auto;padding:20px}
h2{font-size:1rem;letter-spacing:.2em;margin:28px 0 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{width:100%;font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.post img{max-width:100%;border-radius:8px;margin:8px 0}
.post h3{margin:0 0 4px}
.who{font-size:.85rem;color:var(--mute)}
.badge{color:var(--accent);font-weight:700}
.actions{display:flex;gap:8px;margin-top:10px;align-items:center}
.heart.on{color:#ff4d6d;border-color:#ff4d6d}
.cmt{border-top:1px solid var(--line);padding:8px 0;font-size:.95rem}
.cmt:first-child{margin-top:12px}
.err{color:#ff6b6b;font-size:.9rem;min-height:1.2em}
.hide{display:none}
footer{text-align:center;color:var(--mute);padding:32px 20px;font-size:.85rem}
</style>
</head>

  <p>The latest anime updates.</p>
</header>
<main>
  <div class="bar">
    <span id="who">Posting as a guest</span>
    <button id="loginBtn">Owner login</button>
  </div>

  <form id="loginForm" class="box hide">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" type="submit">Log in</button>
    <div class="err" id="loginErr"></div>
  </form>

  <h2>NEW POST</h2>
  <form id="postForm" class="box">
    <input id="pName" maxlength="50" placeholder="Your name">
    <input id="pTitle" maxlength="120" placeholder="Title" required>
    <textarea id="pCaption" rows="3" placeholder="Caption"></textarea>
    <input id="pUrl" type="url" placeholder="Image link (optional)">
    <button class="primary" type="submit">Post</button>
    <div class="err" id="postErr"></div>
  </form>

  <h2>LATEST UPDATES</h2>
  <div id="feed"><p class="who">Loading…</p></div>
</main>
<footer>© Blackhouse Media</footer>

<script>
const SUPABASE_URL = "https://lqlzizbiegyxjjbtdgjb.supabase.co";
const SUPABASE_KEY = "sb_publishable_QTwQyX81__jaKLKkYPLGdA_ySiit-Rq";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const BADGE = '<span class="badge" title="Owner">✓</span>';

let isAdmin = false;
let clientId = null;
try { clientId = localStorage.getItem("bh_client"); if (!clientId) { clientId = crypto.randomUUID(); localStorage.setItem("bh_client", clientId); } }
catch (e) { clientId = "tmp-" + Math.random().toString(36).slice(2); }

function esc(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch(e){ return ""; } }

async function refreshAuth(){
  const { data } = await db.auth.getSession();
  isAdmin = !!data.session;
  $("who").innerHTML = isAdmin ? "Logged in as owner " + BADGE : "Posting as a guest";
  $("loginBtn").textContent = isAdmin ? "Log out" : "Owner login";
  if (isAdmin) $("loginForm").classList.add("hide");
}

$("loginBtn").onclick = async () => {
  if (isAdmin) { await db.auth.signOut(); await refreshAuth(); load(); }
  else $("loginForm").classList.toggle("hide");
};

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) { $("loginErr").textContent = "Login failed: " + error.message; return; }
  $("pass").value = "";
  await refreshAuth(); load();
};

$("postForm").onsubmit = async e => {
  e.preventDefault();
  $("postErr").textContent = "";
  const url = $("pUrl").value.trim();
  const row = {
    title: $("pTitle").value.trim(),
    caption: $("pCaption").value.trim() || null,
    media_url: url ? safeUrl(url) || null : null,
    author_name: isAdmin ? ($("pName").value.trim() || "Owner") : ($("pName").value.trim() || "Guest"),
    is_admin: isAdmin
  };
  if (!row.title) return;
  const { error } = await db.from("posts").insert(row);
  if (error) { $("postErr").textContent = "Could not post: " + error.message; return; }
  e.target.reset(); load();
};

async function load(){
  const [p, c, h] = await Promise.all([
    db.from("posts").select("*").order("created_at", { ascending: false }),
    db.from("comments").select("*").order("created_at", { ascending: true }),
    db.from("hearts").select("post_id, client_id")
  ]);
  if (p.error) { $("feed").innerHTML = '<p class="err">Could not load posts: ' + esc(p.error.message) + '</p>'; return; }
  if (!p.data.length) { $("feed").innerHTML = '<p class="who">No posts yet. Be the first to post.</p>'; return; }
  const comments = c.data || [], hearts = h.data || [];
  $("feed").innerHTML = p.data.map(post => {
    const pc = comments.filter(x => x.post_id === post.id);
    const ph = hearts.filter(x => x.post_id === post.id);
    const mine = ph.some(x => x.client_id === clientId);
    const img = safeUrl(post.media_url);
    return `<article class="box post" data-id="${post.id}">
      <h3>${esc(post.title)}</h3>
      <div class="who">${esc(post.author_name || "Guest")} ${post.is_admin ? BADGE : ""} · ${new Date(post.created_at).toLocaleString()}</div>
      ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}
      ${post.caption ? `<p>${esc(post.caption)}</p>` : ""}
      <div class="actions">
        <button class="heart ${mine ? "on" : ""}" data-heart="${post.id}">♥ ${ph.length}</button>
        ${isAdmin ? `<button data-delpost="${post.id}">Delete post</button>` : ""}
      </div>
      <div>${pc.map(x => `<div class="cmt"><b>${esc(x.author_name || "Guest")}</b> ${x.is_admin ? BADGE : ""} ${esc(x.body)}
        ${isAdmin ? `<button data-delcmt="${x.id}">Delete</button>` : ""}</div>`).join("")}</div>
      <form data-cform="${post.id}" style="margin-top:10px">
        <input maxlength="50" name="n" placeholder="Your name">
        <input maxlength="500" name="b" placeholder="Write a comment" required>
        <button type="submit">Comment</button>
        <div class="err"></div>
      </form>
    </article>`;
  }).join("");
}

$("feed").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.heart) {
    if (t.classList.contains("on")) {
      await db.from("hearts").delete().eq("post_id", t.dataset.heart).eq("client_id", clientId);
    } else {
      await db.from("hearts").insert({ post_id: t.dataset.heart, client_id: clientId });
    }
    load();
  } else if (t.dataset.delpost) {
    if (confirm("Delete this post?")) { await db.from("posts").delete().eq("id", t.dataset.delpost); load(); }
  } else if (t.dataset.delcmt) {
    if (confirm("Delete this comment?")) { await db.from("comments").delete().eq("id", t.dataset.delcmt); load(); }
  }
});

$("feed").addEventListener("submit", async e => {
  const f = e.target;
  if (!f.dataset.cform) return;
  e.preventDefault();
  const body = f.elements.b.value.trim();
  if (!body) return;
  const name = f.elements.n.value.trim();
  const { error } = await db.from("comments").insert({
    post_id: f.dataset.cform,
    author_name: name || (isAdmin ? "Owner" : "Guest"),
    body, is_admin: isAdmin
  });
  if (error) { f.querySelector(".err").textContent = "Could not comment: " + error.message; return; }
  load();
});

refreshAuth().then(load);
</script>
</body>
</html>
